name: Build & publish firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "web/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set firmware version = build number
        run: |
          echo "#pragma once" > firmware/recipe/version.h
          echo "#define FW_VERSION ${{ github.run_number }}" >> firmware/recipe/version.h
          cat firmware/recipe/version.h

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core & libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "GxEPD2" "Adafruit GFX Library" "WiFiManager" "U8g2_for_Adafruit_GFX"

      - name: Compile
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir build \
            firmware/recipe 2>&1 | tee compile.log || {
              # 把编译错误写成注释，方便在网页/API 上直接看到
              grep -iE "error|exceed|overflow|not declared|no such|Sketch uses|Maximum|too big|overflowed" compile.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            }
          grep -E "Sketch uses|Global variables" compile.log | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Prepare site
        run: |
          mkdir -p site
          cp build/recipe.ino.bin site/firmware.bin                 # OTA 用
          cp build/recipe.ino.merged.bin site/firmware.merged.bin   # 网页首刷用
          echo "${{ github.run_number }}" > site/version.txt
          cat > site/manifest.json <<EOF
          {
            "name": "ESP32 墨水屏食谱看板",
            "version": "${{ github.run_number }}",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32",
                "parts": [ { "path": "firmware.merged.bin", "offset": 0 } ] }
            ]
          }
          EOF
          cp web/index.html site/index.html
          ls -l site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
